name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs for the same branch/PR — only the latest matters
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest

    env:
      # Prisma needs DATABASE_URL defined to load the schema, even though
      # `next build` doesn't actually hit the DB (all pages are dynamic).
      DATABASE_URL: "file:./dev.db"
      # NextAuth requires these at build time for Edge middleware
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-only-secret-do-not-use-in-prod-ci-only-32b"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --quiet

      - name: Build
        run: npx next build
